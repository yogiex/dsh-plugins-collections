# Lapisan patch profil `web` — hanya bagian yang relevan untuk plugin.
# Entri `insert` di bawah memasang dsh-bg-gradient; plugin ini sengaja TIDAK
# dimasukkan ke `dsh.profile.bundles` agar tidak ter-mount dua kali (loader
# tidak melakukan dedupe id).
- insert:
    - id: dsh-bg-gradient
      name: '@local/dsh-bg-gradient'
      config:
        mode: gradient      # none | gradient | solid | wallpaper | upload
        preset: aurora
        intensity: 100
        dim: 40             # readability scrim for solid/wallpaper/upload
        animate: true
